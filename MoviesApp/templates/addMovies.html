{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Movie</title>
    <link rel="stylesheet" href="{% static 'bootstrap.css' %}">
</head>
<body>
    <div class="container py-5">
        <h1 class="display-4 text-center mb-4">Add New Movie</h1>

        <div class="row mb-4">
            <div class="col-12">
                <a class="btn btn-secondary" href="{% url 'index' %}">← Back</a>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="card shadow">
                    <div class="card-body">
                        <form method="post" enctype="multipart/form-data">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end gap-3">
                                <button class="btn btn-success btn-lg" type="submit">Add Movie</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'bootstrap.js' %}"></script>
</body>
</html>
